name: CI devops 2025

on:
  # Lance la pipeline à chaque push sur main et develop
  push:
    branches:
      - main
      - dev
  # Lance aussi la pipeline à chaque pull request
  pull_request:

jobs:
  # ===== JOB 1 : compiler, tester et analyser le backend =====
  test-backend:
    # Machine virtuelle Ubuntu fournie par GitHub
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code du dépôt sur la machine
      - uses: actions/checkout@v4
        with:
          # Récupère tout l'historique Git (nécessaire à SonarCloud pour identifier le nouveau code)
          fetch-depth: 0

      # Installe le JDK 21 (distribution Temurin, la même que dans nos Dockerfiles)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Garde les dépendances Maven en cache entre deux exécutions (plus rapide)
          cache: maven

      # Compile l'application et lance les tests unitaires et d'intégration
      - name: Build and test with Maven
        run: mvn clean verify --file ./simpleapi/pom.xml

      # Analyse de la qualité du code avec SonarCloud
      # -B : mode non interactif (adapté à une pipeline)
      # sonar.projectKey / sonar.organization : identifient le projet sur SonarCloud
      # sonar.host.url : adresse du serveur SonarCloud
      # sonar.login : token d'authentification, stocké dans les secrets GitHub
      - name: SonarCloud analysis
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=EmmaLehec_Cours_DevOps -Dsonar.organization=emmalehec -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file ./simpleapi/pom.xml

    # ===== JOB 2 : construire et publier les images Docker =====
  build-and-push-docker-image:
    # Ne démarre que si test-backend a réussi (code qui compile + tests OK)
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code du dépôt (chaque job repart d'une machine vierge)
      - name: Checkout code
        uses: actions/checkout@v4

      # Calcule le SHA court du commit (7 premiers caractères, comme git log --oneline)
      # et le stocke dans la variable d'environnement SHORT_SHA pour les étapes suivantes
      - name: Get short commit SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Connexion à Docker Hub avec les identifiants stockés dans les secrets GitHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Build et push de l'image du backend
      # Deux tags : "latest" (dernière version) et le SHA du commit (historique des versions)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simpleapi
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:${{ env.SHORT_SHA }}
          # Build sur toutes les branches, mais publie uniquement sur main
          push: ${{ github.ref == 'refs/heads/main' }}

      # Build et push de l'image de la base de données
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:${{ env.SHORT_SHA }}
          push: ${{ github.ref == 'refs/heads/main' }}

      # Build et push de l'image du reverse proxy
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:${{ env.SHORT_SHA }}
          push: ${{ github.ref == 'refs/heads/main' }}
      
      # Build et push de l'image du front
      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-front:${{ env.SHORT_SHA }}
          push: ${{ github.ref == 'refs/heads/main' }}
  
    # ===== JOB 3 : déployer l'application sur le serveur avec Ansible =====
  deploy:
    # Ne démarre que si les images ont été construites et publiées
    needs: build-and-push-docker-image
    # Déploie uniquement depuis main (les autres branches ne publient pas d'images)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code (dont le dossier ansible/)
      - name: Checkout code
        uses: actions/checkout@v4

      # Installe Ansible et la collection qui contient les modules docker_*
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      # Écrit la clé SSH (stockée dans les secrets GitHub) dans un fichier
      # et ajoute l'empreinte du serveur aux hôtes connus, pour que SSH accepte la connexion
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan emma.lehec.takima.school >> ~/.ssh/known_hosts

      # Lance le playbook Ansible
      # Le mot de passe du vault (secret GitHub) est écrit dans un fichier temporaire,
      # qu'Ansible utilise pour déchiffrer inventories/group_vars/all/vault.yml
      - name: Deploy with Ansible
        working-directory: ./ansible
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-playbook -i inventories/setup.yml playbook.yml \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa" \
            --vault-password-file .vault_pass
          rm -f .vault_pass